<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생각하는 글밭 — 브랜드 01. 간판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: #E8D5C0;
    display: flex; flex-direction: column; align-items: center;
    gap: 40px; padding: 40px 0;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .card {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  body.scaled { display: block; padding: 10px; }
  body.scaled .card { transform-origin: top left; display: flex; margin-bottom: 10px; }

  /* 그리드 안전영역 — 1:1 중앙 크롭에서 살아남는 1080×1080 */
  .safe {
    position: absolute; top: 135px; left: 0; width: 1080px; height: 1080px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .above-fold, .below-fold {
    position: absolute; left: 0; width: 100%; text-align: center; color: #A67B5B;
  }
  .above-fold { top: 165px; }
  .below-fold { bottom: 165px; }
  .brand-tag { font-size: 26px; font-weight: 700; letter-spacing: 6px; opacity: 0.65; }

  .card-1 { background: #F5E6D0; color: #5C3D2E; }
  /* 간판 원본은 16:9. 1:1 로 잘리면 글자가 날아가므로 full-bleed 로 쓰지 않고
     크림 배경 위에 얹어 안전영역 한가운데 둔다. */
  .sign {
    width: 900px;
    border-radius: 36px;
    box-shadow: 0 24px 60px rgba(92,61,46,0.22);
  }
  .opened {
    margin-top: 64px;
    font-size: 46px; font-weight: 900; letter-spacing: -1px;
  }
  .opened em { font-style: normal; color: #C4956A; }
  .site {
    margin-top: 24px;
    font-size: 32px; font-weight: 500; color: #A67B5B; letter-spacing: 1px;
  }
</style>
</head>
<body>

<section class="card card-1">
  <div class="above-fold"><div class="brand-tag">WHERE THOUGHTS GROW</div></div>
  <div class="safe">
    <img class="sign" src="../assets/characters/signboard_thinkingfield.png" alt="생각하는 글밭 간판">
    <div class="opened">아이의 생각이 자라는 <em>밭</em>을 가꿉니다</div>
    <div class="site">wherethoughtsgrow.com</div>
  </div>
</section>

<script>
function scaleCards() {
  var vw = window.innerWidth;
  if (vw >= 1080) {
    document.body.classList.remove('scaled');
    document.querySelectorAll('.card').forEach(function(c){ c.style.transform=''; c.style.marginBottom=''; });
    return;
  }
  document.body.classList.add('scaled');
  var s = vw / 1080; var realH = 1350 * s;
  document.querySelectorAll('.card').forEach(function(c){
    c.style.transform = 'scale(' + s + ')';
    c.style.marginBottom = (realH - 1350) + 'px';
  });
}
scaleCards();
window.addEventListener('resize', scaleCards);
</script>
</body>
</html>
