<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생각하는 글밭 — 문해력 진단 받기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: #E8D5C0;
    display: flex; flex-direction: column; align-items: center;
    gap: 40px; padding: 40px 0;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .card {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  body.scaled { display: block; padding: 10px; }
  body.scaled .card { transform-origin: top left; display: flex; margin-bottom: 10px; }

  /* 그리드 안전영역 — 1:1 중앙 크롭에서 살아남는 1080×1080 */
  .safe {
    position: absolute; top: 135px; left: 0; width: 1080px; height: 1080px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .above-fold, .below-fold {
    position: absolute; left: 0; width: 100%; text-align: center;
  }
  .above-fold { top: 165px; }
  .below-fold { bottom: 165px; }
  .card-number {
    position: absolute; top: 160px; right: 50px; font-size: 28px; font-weight: 700;
    opacity: 0.5; letter-spacing: 2px; z-index: 5;
  }
  .brand-tag { font-size: 26px; font-weight: 700; letter-spacing: 6px; opacity: 0.6; }
  .swipe { font-size: 30px; font-weight: 700; letter-spacing: 8px; opacity: 0.55; }

  .portrait-wrap {
    border-radius: 50%; overflow: hidden;
    border: 12px solid #FBF3EA;
    box-shadow: 0 16px 40px rgba(0,0,0,0.28);
    flex-shrink: 0;
  }
  .portrait-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: var(--fx) var(--fy);
    transform: scale(var(--zoom));
    transform-origin: var(--fx) var(--fy);
  }

  /* ─── 01 후크 — 프로필 맨 왼쪽 위에 앉는 칸 ─── */
  .card-1 { background: #5C3D2E; color: #F5E6D0; }
  .card-1 .above-fold, .card-1 .below-fold, .card-1 .card-number { color: #F5E6D0; }
  .card-1 .hook {
    font-size: 92px; font-weight: 900; line-height: 1.4;
    text-align: center; word-break: keep-all;
  }
  .card-1 .hook em { font-style: normal; color: #A8C07A; }
  .card-1 .ring { width: 300px; height: 300px; margin-bottom: 56px; }
  .card-1 .who { margin-top: 34px; font-size: 34px; font-weight: 500; color: #D4BFA8; }

  /* ─── 02 진단이 보여주는 것 ─── */
  .card-2 { background: #F5E6D0; color: #5C3D2E; }
  .card-2 .above-fold, .card-2 .below-fold, .card-2 .card-number { color: #A67B5B; }
  .card-2 .label {
    font-size: 34px; font-weight: 700; color: #A67B5B;
    letter-spacing: 8px; margin-bottom: 50px;
  }
  .card-2 .big {
    font-size: 82px; font-weight: 900; line-height: 1.45;
    text-align: center; word-break: keep-all;
  }
  .card-2 .big em { font-style: normal; color: #C4956A; }
  .card-2 .rows { margin-top: 62px; width: 800px; }
  .card-2 .row {
    display: flex; align-items: center; gap: 26px;
    padding: 26px 34px; background: #FBF3EA;
    border-radius: 28px; margin-bottom: 20px;
  }
  .card-2 .row .no {
    width: 58px; height: 58px; flex-shrink: 0;
    background: #6B7F4A; color: #FBF3EA; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    font-size: 30px; font-weight: 900;
  }
  .card-2 .row .txt { font-size: 34px; font-weight: 700; color: #5C3D2E; }

  /* ─── 03 행동 ─── */
  .card-3 { background: #6B7F4A; color: #FBF3EA; }
  .card-3 .above-fold, .card-3 .card-number { color: #FBF3EA; }
  .card-3 .free {
    background: #FBF3EA; color: #6B7F4A;
    font-size: 34px; font-weight: 900; letter-spacing: 2px;
    padding: 16px 42px; border-radius: 999px; margin-bottom: 44px;
  }
  .card-3 .go {
    font-size: 94px; font-weight: 900; line-height: 1.35;
    text-align: center; word-break: keep-all;
  }
  .card-3 .how {
    margin-top: 46px; font-size: 38px; font-weight: 500;
    line-height: 1.75; text-align: center; color: #E8EFDC; word-break: keep-all;
  }
  .card-3 .url {
    margin-top: 56px; background: #5C3D2E; color: #F5E6D0;
    font-size: 38px; font-weight: 700; padding: 24px 56px; border-radius: 999px;
  }
</style>
</head>
<body>

<!-- 01 후크 -->
<section class="card card-1">
  <div class="card-number">01 / 03</div>
  <div class="above-fold"><div class="brand-tag">생각하는 글밭</div></div>
  <div class="safe">
    <div class="portrait-wrap ring" style="--fx:50%; --fy:40%; --zoom:1.45;">
      <img src="../assets/characters/byeolsaem_clay.png" alt="별쌤">
    </div>
    <div class="hook">우리 아이 문해력,<br>지금 <em>어디쯤</em>일까요?</div>
    <div class="who">진단을 맡은 농부, 별쌤</div>
  </div>
  <div class="below-fold"><div class="swipe">SWIPE →</div></div>
</section>

<!-- 02 무엇을 보여주나 -->
<section class="card card-2">
  <div class="card-number">02 / 03</div>
  <div class="safe">
    <div class="label">진단이 알려주는 것</div>
    <div class="big">등수가 아니라<br><em>지도</em>를 드려요</div>
    <div class="rows">
      <div class="row"><div class="no">1</div><div class="txt">지금 어디까지 읽어낼 수 있는지</div></div>
      <div class="row"><div class="no">2</div><div class="txt">어떤 지점에서 자꾸 걸리는지</div></div>
      <div class="row"><div class="no">3</div><div class="txt">다음 한 걸음은 무엇인지</div></div>
    </div>
  </div>
  <div class="below-fold"><div class="swipe">SWIPE →</div></div>
</section>

<!-- 03 행동 -->
<section class="card card-3">
  <div class="card-number">03 / 03</div>
  <div class="above-fold"><div class="brand-tag">WHERE THOUGHTS GROW</div></div>
  <div class="safe">
    <div class="free">무료</div>
    <div class="go">지금 바로<br>진단 받아보기</div>
    <div class="how">프로필 링크를 누르면<br>바로 시작할 수 있어요</div>
    <div class="url">wherethoughtsgrow.com</div>
  </div>
</section>

<script>
function scaleCards() {
  var vw = window.innerWidth;
  if (vw >= 1080) {
    document.body.classList.remove('scaled');
    document.querySelectorAll('.card').forEach(function(c){ c.style.transform=''; c.style.marginBottom=''; });
    return;
  }
  document.body.classList.add('scaled');
  var s = vw / 1080; var realH = 1350 * s;
  document.querySelectorAll('.card').forEach(function(c){
    c.style.transform = 'scale(' + s + ')';
    c.style.marginBottom = (realH - 1350) + 'px';
  });
}
scaleCards();
window.addEventListener('resize', scaleCards);
</script>
</body>
</html>
