<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생각하는 글밭 · Game</title>
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#2b2620; --muted:#7a7168; --line:#e7e0d3;
  --philo:#6b7a99; --byeol:#ff8a3d; --geul:#ff6b4a; --chaek:#9a7b45;
  --hogi:#f0b429; --eun:#b5892b; --kkan:#3a3a3a; --red:#e23b3b;
  --good:#2f9e6f; --shadow:0 8px 26px rgba(60,45,25,.10);
  --r:20px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#191712;--card:#231f19;--ink:#f0eadf;--muted:#a99e90;--line:#332d24;
    --shadow:0 10px 30px rgba(0,0,0,.35);}
}
:root[data-theme="dark"]{--bg:#191712;--card:#231f19;--ink:#f0eadf;--muted:#a99e90;--line:#332d24;--shadow:0 10px 30px rgba(0,0,0,.35);}
:root[data-theme="light"]{--bg:#f6f3ec;--card:#fffdf8;--ink:#2b2620;--muted:#7a7168;--line:#e7e0d3;--shadow:0 8px 26px rgba(60,45,25,.10);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:radial-gradient(120% 80% at 50% -10%, rgba(255,138,61,.10), transparent 60%), var(--bg);
  color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  line-height:1.55; -webkit-font-smoothing:antialiased;
  min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
/* ---- 게임 배경 & 장식 ---- */
:root{--sA:#7bc47f;--sB:#f0b429}
body{background:
   radial-gradient(80% 55% at 10% -8%, color-mix(in srgb,var(--sA) 32%,transparent), transparent 58%),
   radial-gradient(85% 60% at 108% 110%, color-mix(in srgb,var(--sB) 28%,transparent), transparent 55%),
   var(--bg);
  background-attachment:fixed}
#scenebg{position:fixed;inset:0;z-index:0;pointer-events:none;background-repeat:no-repeat;
  background-position:bottom -22px right -16px;background-size:min(46%,320px);opacity:0;
  transition:opacity .45s ease;filter:saturate(1.05)}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco span{position:absolute;border-radius:50%;opacity:.3;filter:blur(1px);
  background:radial-gradient(circle at 32% 30%, color-mix(in srgb,var(--sA) 78%,#fff), color-mix(in srgb,var(--sB) 60%,transparent));
  animation:float 10s ease-in-out infinite}
#deco span:nth-child(1){width:74px;height:74px;left:5%;top:15%}
#deco span:nth-child(2){width:34px;height:34px;left:84%;top:11%;animation-delay:1.3s}
#deco span:nth-child(3){width:56px;height:56px;left:88%;top:58%;animation-delay:.6s}
#deco span:nth-child(4){width:26px;height:26px;left:12%;top:72%;animation-delay:2.1s}
#deco span:nth-child(5){width:46px;height:46px;left:44%;top:6%;animation-delay:1.7s}
#deco span:nth-child(6){width:30px;height:30px;left:72%;top:86%;animation-delay:.9s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.07)}}
@media(prefers-reduced-motion:reduce){#deco span{animation:none}}
.ava{overflow:hidden}
.avimg{width:100%;height:100%;object-fit:cover;display:block}
.whoav{width:22px;height:22px;border-radius:7px;object-fit:cover;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.iav{width:22px;height:22px;border-radius:7px;object-fit:cover;vertical-align:-6px;margin:0 2px}
.banner{width:100%;max-width:500px;margin:2px auto 0;aspect-ratio:16/9;border-radius:22px;overflow:hidden;
  background-size:cover;background-position:center 38%;box-shadow:var(--shadow);border:1px solid var(--line);position:relative}
.banner::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top, color-mix(in srgb,var(--bg) 82%,transparent), transparent 52%)}
.banner .cap{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:12.5px;font-weight:800;
  color:var(--ink);z-index:1;letter-spacing:.2px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;position:relative;z-index:1}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:6px 2px 18px}
.brand b{font-size:15px;letter-spacing:-.2px}
.brand small{color:var(--muted);font-weight:500}
.themebtn{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);background:var(--card)}

/* ---- hub ---- */
.hero{text-align:center;padding:14px 8px 6px}
.hero .rabbit{font-size:56px;line-height:1;filter:drop-shadow(0 6px 10px rgba(107,122,153,.35))}
.hero h1{font-size:26px;margin:10px 0 4px;letter-spacing:-.6px}
.hero .gametitle{
  font-family:"Futura","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  font-weight:900;font-style:italic;text-transform:uppercase;
  font-size:clamp(58px,17vw,104px);line-height:.86;letter-spacing:-1px;
  margin:12px 0 4px;
  background:linear-gradient(120deg,#ff8a3d,#ff5a5f 42%,#f0b429);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 6px 16px rgba(255,120,60,.30))}
.hero p{color:var(--muted);margin:0 auto;max-width:30em;font-size:15px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;
  box-shadow:var(--shadow);margin:16px auto;max-width:34em;text-align:left;font-size:14.5px;position:relative}
.bubble .who{font-weight:700;font-size:12.5px;color:var(--philo);display:flex;gap:6px;align-items:center;margin-bottom:5px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 15px;
  box-shadow:var(--shadow);text-align:left;transition:transform .12s ease, box-shadow .12s ease;
  display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;width:100%}
.card:active{transform:scale(.985)}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(60,45,25,.16)}
.card .top{display:flex;align-items:center;gap:11px}
.card .ava{font-size:30px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;background:var(--tint,#eee)}
.card h3{margin:0;font-size:16.5px;letter-spacing:-.3px}
.card .role{font-size:12px;color:var(--muted);margin-top:1px}
.card .desc{font-size:13px;color:var(--muted)}
.card .tag{font-size:11px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);
  padding:3px 9px;border-radius:999px;align-self:flex-start}
.card .done{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;color:var(--good)}
.card.locked{opacity:.55}
.card.locked::after{content:"🔒 별쌤 진단 먼저";position:absolute;inset:auto 0 0 0;background:var(--card);
  font-size:11px;color:var(--muted);text-align:center;padding:5px;border-top:1px dashed var(--line)}
.card.boss{grid-column:1/-1;border:1.5px solid color-mix(in srgb,var(--eun) 45%,var(--line))}
.card.diag{grid-column:1/-1;border:1.5px solid color-mix(in srgb,var(--byeol) 45%,var(--line))}

/* ---- game screen ---- */
.screen{display:none}
.screen.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;background:var(--card);color:var(--muted)}
.prog{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.combo{font-size:13px;font-weight:800;color:var(--accent);min-width:44px;text-align:right}

.hdr{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.hdr .ava{font-size:34px;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:var(--tint)}
.hdr .name{font-weight:800;font-size:15px}
.hdr .sub{font-size:12.5px;color:var(--muted)}
.say{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:12px;padding:11px 14px;font-size:14px;margin:12px 0 16px;min-height:20px}

.q{font-size:20px;font-weight:700;letter-spacing:-.3px;margin:6px 2px 4px;line-height:1.4}
.q .blank{color:var(--accent);border-bottom:2px dashed var(--accent);padding:0 12px}
.qhint{font-size:13px;color:var(--muted);margin:0 2px 16px}
.q u,.opt u{text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--accent)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:15px 16px;
  font-size:17px;text-align:left;font-weight:600;transition:.12s;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt:active{transform:scale(.99)}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--card))}
.opt .mk{font-size:18px;opacity:0}
.opt.correct .mk,.opt.wrong .mk{opacity:1}
.opt[disabled]{cursor:default}

/* find-wrong tokens */
.sent{font-size:20px;font-weight:600;line-height:2;margin:10px 2px 8px}
.tok{border:none;background:none;font:inherit;padding:2px 4px}
.tok.c{border:1.5px dashed color-mix(in srgb,var(--accent) 60%,var(--line));border-radius:8px;
  padding:3px 8px;margin:0 1px;transition:.12s}
.tok.c:active{transform:scale(.96)}
.tok.c.correct{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tok.c.wrong{border-style:solid;border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}

.explain{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:16px;
  font-size:14px;animation:fade .2s ease}
.explain .verdict{font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.explain .rule{color:var(--ink);font-size:14.5px;line-height:1.6;opacity:.92}
.explain b{color:var(--accent);font-weight:800}
.next{width:100%;margin-top:14px;background:var(--accent);color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:800}
.next.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}

/* result */
.result{text-align:center;padding:8px}
.result .big{font-size:48px;margin:6px}
.result .stars{font-size:34px;letter-spacing:4px;margin:6px 0}
.result h2{margin:6px 0 2px;font-size:22px}
.result .score{color:var(--muted);font-size:15px}
.lvcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0;text-align:left;box-shadow:var(--shadow)}
.cert{border:2px solid var(--eun);border-radius:18px;padding:22px;margin:16px 0;text-align:center;
  background:repeating-linear-gradient(135deg,transparent,transparent 12px,color-mix(in srgb,var(--eun) 5%,transparent) 12px,color-mix(in srgb,var(--eun) 5%,transparent) 24px),var(--card)}
.cert .seal{font-size:40px}
.cert h2{margin:6px 0}
.cert .sig{margin-top:14px;font-size:13px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
.foot b{color:var(--philo)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="scenebg"></div>
<div id="deco" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="wrap">
  <div class="brand">
    <b>🌱 생각하는 글밭</b>
    <button class="themebtn" id="themebtn">🌗 화면</button>
  </div>
  <div id="app"></div>
  <div class="foot"><b>필로</b>가 함께해요 · Where Thoughts Grow</div>
</div>

const KEY="geulbat-game-v1";
let S = load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function accent(ch){return getComputedStyle(document.documentElement).getPropertyValue(CH[ch].ac)}
function av(ch){return '<img class="avimg" src="'+(IMG[ch]||"")+'" alt="'+CH[ch].n+'" draggable="false">';}
function iav(ch){return '<img class="iav" src="'+(IMG[ch]||"")+'" alt="'+CH[ch].n+'">';}
const SCENE={hub:{a:"#7bc47f",b:"#f0b429"},geul:{a:"#ff8a5c",b:"#ffd36b"},hogi:{a:"#ffcf3f",b:"#ff9a45"},
  chaek:{a:"#6d8bce",b:"#b58adf"},kkan:{a:"#ff6f6f",b:"#ffab8b"},byeol:{a:"#ff9f5c",b:"#ffd86b"},eun:{a:"#c08adf",b:"#ff8a6c"}};
function setScene(ch,opts){opts=opts||{};const sc=SCENE[ch]||SCENE.hub;
  const r=document.documentElement.style;r.setProperty("--sA",sc.a);r.setProperty("--sB",sc.b);
  const el=document.getElementById("scenebg");if(!el)return;
  if(opts.none){el.style.opacity=0;return;}
  if(opts.img){el.style.backgroundImage="url("+opts.img+")";el.style.backgroundSize="cover";el.style.backgroundPosition="center";el.style.opacity=opts.op!=null?opts.op:.13;}
  else{el.style.backgroundImage="url("+(IMG[ch]||"")+")";el.style.backgroundSize="min(46%,320px)";el.style.backgroundPosition="bottom -22px right -16px";el.style.opacity=opts.op!=null?opts.op:.12;}
}

const app=document.getElementById("app");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickRounds(pool,n){const a=shuffle(pool.slice());return (n&&n<a.length)?a.slice(0,n):a;}
const BOSS_N=6;

function hub(){
  const order=["geul","hogi","chaek","kkan"];
  const allDone=order.every(k=>S[k]&&S[k].done);
  const diagDone=S.diag&&S.diag.done;
  let cards=order.map(k=>{
    const g=GAMES[k],c=CH[g.ch],r=S[k];
    const done=r&&r.done?`<span class="done">✓ ${r.correct}/${r.total}</span>`:"";
    return `<button class="card" style="--tint:${c.tint};--accent:${accent(g.ch)}" onclick="start('${k}')">
      ${done}
      <div class="top"><div class="ava">${av(g.ch)}</div>
        <div><h3>${g.title}</h3><div class="role">${c.n} · ${c.role}</div></div></div>
      <div class="desc">${g.intro.split(".")[0]}.</div>
      <span class="tag">${g.area}</span>
    </button>`;
  }).join("");

  const diag=`<button class="card diag ${allDone?"":"locked"}" style="--tint:${CH.byeol.tint};--accent:${accent('byeol')}"
      onclick="${allDone?"start('diag')":""}">
      ${diagDone?`<span class="done">별 ${S.diag.stars}개</span>`:""}
      <div class="top"><div class="ava">${av('byeol')}</div>
        <div><h3>문해력 진단 ⭐</h3><div class="role">별쌤 · 네 게임 종합 판정</div></div></div>
      <div class="desc">${allDone?"네 게임 결과를 모아 지금 수준을 재고, 다음 단계를 알려줄게요.":"먼저 위 네 게임을 모두 끝내면 열려요."}</div>
      <span class="tag">종합 진단</span>
    </button>`;

  const boss=`<button class="card boss ${diagDone?"":"locked"}" style="--tint:${CH.eun.tint};--accent:${accent('eun')}"
      onclick="${diagDone?"start('boss')":""}">
      ${S.boss&&S.boss.done?`<span class="done">✓ 인증 완료</span>`:""}
      <div class="top"><div class="ava">${av('eun')}</div>
        <div><h3>최종 보스전 🏆</h3><div class="role">은쌤 · 심화 인증</div></div></div>
      <div class="desc">${diagDone?"교육과정 기준으로도 까다로운 심화 문제. 통과하면 은쌤이 인증서를 줘요.":"별쌤 진단을 먼저 통과하면 열려요."}</div>
      <span class="tag">심화 종합</span>
    </button>`;

  app.innerHTML=`
    <div class="hero">
      <div class="banner" style="background-image:url(${BG.forest})"><div class="cap">🌱 생각하는 글밭 친구들이 기다려요</div></div>
      <h1 class="gametitle">Game</h1>
      <p>헷갈리는 우리말, 놀면서 정복하기</p>
    </div>
    <div class="bubble">
      <div class="who"><img class="whoav" src="${IMG.philo}" alt="필로">필로</div>
      안녕, 나는 필로예요. 여기 여섯 친구가 각자 게임을 하나씩 준비했어요.
      맞춤법·어휘·띄어쓰기·속담까지, 헷갈리기 딱 좋은 것만 골랐지요.
      순서는 자유예요. 네 게임을 다 깨면 <b>별쌤</b>이 지금 실력을 재 주고,
      마지막엔 <b>은쌤</b>의 보스전이 기다려요. 자, 시작해 볼까요?
    </div>
    <div class="grid">${cards}${diag}${boss}</div>`;
  setScene('hub',{none:true});
  window.scrollTo(0,0);
}

/* ============================ 게임 진행 ============================ */
let cur=null;
function start(key){
  if(key==="diag") return diagnose();
  if(key==="boss") return bossIntro();
  const g=GAMES[key];
  cur={key,g,rounds:pickRounds(g.data,g.n),i:0,correct:0,combo:0,best:0,answered:false};
  document.documentElement.style.setProperty("--accent-fixed",accent(g.ch));
  runRound();
}

function shell(inner,accentColor){
  app.innerHTML=`<div class="screen on" style="--accent:${accentColor}">${inner}</div>`;
  window.scrollTo(0,0);
}

function runRound(){
  const {g,i}=cur; const c=CH[g.ch]; const ac=accent(g.ch);
  cur.answered=false;
  setScene(g.ch, cur.key==="boss"?{img:BG.office,op:.14}:{});
  const q=cur.rounds[i]; const total=cur.rounds.length;
  const pct=Math.round((i)/total*100);
  const head=`
   <div class="gbar">
     <button class="back" onclick="hub()">← 나가기</button>
     <div class="prog"><i style="width:${pct}%"></i></div>
     <div class="combo">${cur.combo>1?"🔥"+cur.combo:""}</div>
   </div>
   <div class="hdr"><div class="ava">${av(g.ch)}</div>
     <div><div class="name">${c.n}</div><div class="sub">${i+1} / ${total} · ${g.area}</div></div></div>
   <div class="say" id="say">${i===0?g.intro:""}</div>`;

  if(g.mode==="pick"){
    const qhtml=q.q.replace("__",'<span class="blank">?</span>');
    const order=shuffle(q.opts.map((_,k)=>k));
    cur.ans=order.indexOf(q.a);
    const opts=order.map((oi,idx)=>`<button class="opt" data-i="${idx}" onclick="pick(${idx})">
       <span>${esc(q.opts[oi]).replace(/&lt;(\/?u)&gt;/g,"<$1>")}</span><span class="mk"></span></button>`).join("");
    shell(head+`<div class="q">${qhtml}</div>
      <div class="qhint">${q.opts.length>2?"알맞은 것을 고르세요":"둘 중 바른 표기를 고르세요"}</div>
      <div class="opts" id="opts">${opts}</div><div id="tail"></div>`, ac);
  } else { // find
    const toks=q.toks.map((t,idx)=>{
      if(!t.c) return `<span class="tok">${esc(t.t)}</span>`;
      const m=t.t.match(/^(\s*)([\s\S]*?)(\s*)$/);
      return `${m[1]}<button class="tok c" data-i="${idx}" onclick="pickTok(${idx})">${esc(m[2])}</button>${m[3]}`;
    }).join("");
    shell(head+`<div class="qhint" style="margin-top:2px">점선 친 낱말 중 <b>틀린 하나</b>를 누르세요</div>
      <div class="sent">${toks}</div><div id="tail"></div>`, ac);
  }
}

function feedback(ok,ruleHtml,verdictWord){
  const {g}=cur; const ac=accent(g.ch);
  const line = ok ? g.ok[cur.i%g.ok.length] : g.no[cur.i%g.no.length];
  document.getElementById("say").innerHTML=`<b style="color:${ok?'var(--good)':'var(--red)'}">${CH[g.ch].n}</b> · ${line}`;
  const last = cur.i>=cur.rounds.length-1;
  const tail=document.getElementById("tail");
  tail.innerHTML=`<div class="explain">
     <div class="verdict">${ok?"✅ 정답":"✏️ "+ (verdictWord||"오답")}</div>
     <div class="rule">${ruleHtml}</div></div>
     <button class="next" style="background:${ac}" onclick="nextRound()">${last?"결과 보기 →":"다음 문제 →"}</button>`;
  tail.scrollIntoView({behavior:"smooth",block:"nearest"});
}

window.pick=function(idx){
  if(cur.answered) return; cur.answered=true;
  const {g,i}=cur; const q=cur.rounds[i]; const ok=idx===cur.ans;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    const bi=+b.dataset.i; b.disabled=true;
    if(bi===cur.ans){b.classList.add("correct");b.querySelector(".mk").textContent="○";}
    if(bi===idx&&!ok){b.classList.add("wrong");b.querySelector(".mk").textContent="✕";}
  });
  score(ok); feedback(ok,q.rule);
};

window.pickTok=function(idx){
  if(cur.answered) return; cur.answered=true;
  const {g,i}=cur; const q=cur.rounds[i];
  const wrongIdx=q.toks.findIndex(t=>t.w);
  const ok=idx===wrongIdx;
  document.querySelectorAll(".tok.c").forEach(b=>{
    const bi=+b.dataset.i; b.disabled=true;
    if(bi===wrongIdx) b.classList.add(ok?"correct":"wrong");
    if(bi===idx&&!ok) b.classList.add("wrong");
  });
  const fix=q.toks[wrongIdx];
  const rule=`틀린 곳은 <b>‘${fix.w?fix.t.trim():""}’ → ‘${fix.fix}’</b> 예요.<br>${q.rule}`;
  score(ok); feedback(ok,rule,"여기!");
};

function score(ok){
  if(ok){cur.correct++;cur.combo++;cur.best=Math.max(cur.best,cur.combo);}
  else cur.combo=0;
}

window.nextRound=function(){
  cur.i++;
  if(cur.i>=cur.rounds.length) return finishGame();
  runRound();
};

function finishGame(){
  const {key,g,correct}=cur; const total=cur.rounds.length; const c=CH[g.ch];
  S[key]={done:true,correct,total,best:cur.best}; save();
  const pct=correct/total;
  const msg = pct===1 ? "완벽해요! 하나도 안 틀렸어요."
    : pct>=.7 ? "잘했어요! 대부분 정확했어요."
    : pct>=.4 ? "좋아요, 이제 감을 잡았네요." : "괜찮아요, 다시 하면 훨씬 쉬워져요.";
  const emo = pct===1?"🏆":pct>=.7?"🎉":pct>=.4?"💪":"🌱";
  setScene(g.ch);
  shell(`
    <div class="result">
      <div class="hdr" style="justify-content:center">
        <div class="ava">${av(g.ch)}</div>
        <div style="text-align:left"><div class="name">${c.n}</div><div class="sub">${g.title}</div></div>
      </div>
      <div class="big">${emo}</div>
      <h2>${correct} / ${total} 정답</h2>
      <div class="score">최고 콤보 🔥${cur.best} · ${msg}</div>
      <button class="next" style="background:${accent(g.ch)};max-width:320px;margin:22px auto 0" onclick="start('${key}')">다시 도전 ↻</button>
      <button class="next ghost" style="max-width:320px;margin:10px auto 0;--accent:${accent(g.ch)};color:${accent(g.ch)};border-color:${accent(g.ch)}" onclick="hub()">게임관으로 →</button>
    </div>`, accent(g.ch));
}

/* ============================ 별쌤 진단 ============================ */
function diagnose(){
  const ks=["geul","hogi","chaek","kkan"];
  let cor=0,tot=0; ks.forEach(k=>{cor+=S[k].correct;tot+=S[k].total;});
  const pct=cor/tot;
  const stars = pct>=.95?5: pct>=.8?4: pct>=.6?3: pct>=.4?2:1;
  const levels={
    5:{t:"글밭의 대가",d:"헷갈리는 우리말을 거의 완벽하게 다뤄요. 이제 남을 가르쳐도 될 만큼이에요."},
    4:{t:"든든한 문장가",d:"기본기가 탄탄해요. 몇 가지 규칙만 더 챙기면 흔들림이 없겠어요."},
    3:{t:"자라나는 새싹",d:"감을 잘 잡았어요. 자주 틀리는 짝(되/돼, 결제/결재)만 반복하면 쑥 자라요."},
    2:{t:"호기심 많은 탐험가",d:"틀려도 괜찮아요. 규칙을 하나씩 알아가는 중이에요. 다시 하면 눈에 띄게 늘어요."},
    1:{t:"첫걸음 떼는 중",d:"지금부터가 진짜 시작이에요. ‘부족하다’가 아니라 ‘다음 단계로 갈 수 있다’는 뜻이에요."},
  };
  const lv=levels[stars];
  S.diag={done:true,stars,cor,tot}; save();
  const weak=ks.map(k=>({k,r:S[k].correct/S[k].total,n:GAMES[k].title,a:GAMES[k].area}))
    .sort((a,b)=>a.r-b.r)[0];
  setScene('byeol');
  shell(`
    <div class="gbar"><button class="back" onclick="hub()">← 나가기</button></div>
    <div class="result">
      <div class="hdr" style="justify-content:center">
        <div class="ava">${av('byeol')}</div>
        <div style="text-align:left"><div class="name">문해력 진단</div><div class="sub">네 게임 종합</div></div>
      </div>
      <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(5-stars)}</div>
      <h2>${lv.t}</h2>
      <div class="score">종합 ${cor} / ${tot} 정답</div>
      <div class="lvcard">
        <div style="font-weight:800;margin-bottom:6px">${iav('byeol')} 별쌤의 한마디</div>
        ${lv.d}<br><br>
        <span style="color:var(--muted);font-size:13.5px">특히 <b style="color:var(--byeol)">${weak.a}</b>(${weak.n})를 한 번 더 연습하면 다음 별을 딸 수 있어요.</span>
      </div>
      <button class="next" style="background:${accent('eun')};max-width:340px;margin:6px auto 0" onclick="start('boss')">은쌤의 보스전 도전 🏆</button>
      <button class="next ghost" style="max-width:340px;margin:10px auto 0;--accent:${accent('byeol')};color:${accent('byeol')};border-color:${accent('byeol')}" onclick="hub()">게임관으로 →</button>
    </div>`, accent('byeol'));
}

/* ============================ 은쌤 보스전 ============================ */
function bossIntro(){
  cur={key:"boss",g:{ch:"eun",title:"최종 보스전",area:"심화 종합",data:G_EUN,mode:"pick",
    intro:"잘 왔어요. 나는 은쌤이에요. 여기 문제들은 교육과정 기준으로도 꽤 까다로워요. 천천히, 정확하게 골라 봐요.",
    ok:["정확해요. 잘 짚었어요.","맞아요, 근거까지 알면 완벽해요.","훌륭해요."],
    no:["아쉽지만 다시 볼까요.","괜찮아요. 이건 어른도 틀려요.","이 부분만 짚고 가면 돼요."]},
    rounds:pickRounds(G_EUN,BOSS_N),i:0,correct:0,combo:0,best:0,answered:false};
  runRound();
}
// 보스전 finish는 finishGame 대신 인증
const _finish=finishGame;
finishGame=function(){
  if(cur.key!=="boss") return _finish();
  const {correct,g}=cur; const total=cur.rounds.length; const pass=correct>=Math.ceil(total*0.66);
  S.boss={done:true,correct,total,pass}; save();
  if(pass){
    setScene('eun',{img:BG.sign,op:.17});
    shell(`
      <div class="cert">
        <div class="seal">🏅</div>
        <div style="font-size:12px;letter-spacing:3px;color:var(--muted)">생각하는 글밭 · 문해력 인증</div>
        <h2>우리말 지킴이 인증</h2>
        <div style="font-size:15px">최종 보스전 <b>${correct} / ${total}</b> 통과!<br>
          맞춤법·어휘·띄어쓰기·속담을 두루 갖췄음을 인증합니다.</div>
        <div class="sig">${iav('eun')}은쌤 · ${iav('byeol')}별쌤 · ${iav('philo')}필로 드림</div>
      </div>
      <button class="next" style="background:${accent('eun')};max-width:340px;margin:0 auto" onclick="hub()">게임관으로 →</button>
      <button class="next ghost" style="max-width:340px;margin:10px auto 0;--accent:${accent('eun')};color:${accent('eun')};border-color:${accent('eun')}" onclick="start('boss')">다시 도전 ↻</button>
    `, accent('eun'));
  } else {
    setScene('eun',{img:BG.office,op:.12});
    shell(`
      <div class="result">
        <div class="big">🌱</div>
        <h2>${correct} / ${total} 정답</h2>
        <div class="score">${Math.ceil(total*0.66)}문제 이상 맞히면 인증이에요. 조금만 더!</div>
        <div class="lvcard">${iav('eun')} <b>은쌤</b> · 잘 왔어요. 아쉽게 닿지 못했지만, 틀린 문제의 해설을 다시 보면 금세 통과할 거예요. ‘부족하다’가 아니라 ‘거의 다 왔다’는 뜻이니까요.</div>
        <button class="next" style="background:${accent('eun')};max-width:340px;margin:0 auto" onclick="start('boss')">다시 도전 ↻</button>
        <button class="next ghost" style="max-width:340px;margin:10px auto 0;--accent:${accent('eun')};color:${accent('eun')};border-color:${accent('eun')}" onclick="hub()">게임관으로 →</button>
      </div>`, accent('eun'));
  }
};

/* ============================ 테마 ============================ */
document.getElementById("themebtn").onclick=function(){
  const root=document.documentElement;
  const cur=root.getAttribute("data-theme");
  const dark=cur? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  root.setAttribute("data-theme",dark?"light":"dark");
  hub();
};

hub();
</script>
</body>
</html>
